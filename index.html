<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코트픽 · 대학농구 승부예측</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f4f6;--card:#fff;--tx:#191f28;--sub:#6b7684;--line:#e5e8eb;--pri:#3182f6;--priBg:#e8f3ff;--red:#f04452;--grn:#03b26c;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101014;--card:#1c1c22;--tx:#f2f4f6;--sub:#8b95a1;--line:#2c2c35;--priBg:#1b2b44;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hero{background:linear-gradient(160deg,#0b1b3a,#1a3a8f 60%,#3182f6);color:#fff;padding:28px 24px 0;border-radius:0 0 32px 32px;overflow:hidden}
.hero h1{font-size:30px;line-height:1.3;margin:8px 0 6px;letter-spacing:-.5px}.hero p{margin:0 0 18px;opacity:.8;font-size:15px}
.logo{font-weight:800;letter-spacing:-.3px;opacity:.9}
.hero svg{display:block;margin:0 auto -4px;width:100%;height:auto}
.panel{padding:24px}
label{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}
input[type=text],input[type=email],input[type=number]{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:0}
input:focus{border-color:var(--pri)}
.cta{width:100%;margin-top:22px;padding:17px;border-radius:16px;background:var(--pri);color:#fff;font-weight:700;font-size:16px}.cta:disabled{opacity:.35}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.5}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.4px}.sub{color:var(--sub);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{background:var(--card);border:2px solid transparent;border-radius:18px;padding:16px 4px;text-align:center;font-weight:600;font-size:14px}
.tc.on{border-color:var(--pri);background:var(--priBg)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;margin:0 auto 8px;font-size:16px}
.dot.s{width:32px;height:32px;font-size:12px;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 20px 0}
.row{display:flex;align-items:center;justify-content:space-between}
.chip{background:var(--card);border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.coin{width:16px;height:16px;border-radius:50%;background:#ffb800;display:inline-block}
.tabs{display:flex;gap:20px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{background:none;padding:10px 0;color:var(--sub);font-weight:700;font-size:16px;border-bottom:3px solid transparent}.tab.on{color:var(--tx);border-color:var(--tx)}
.date{padding:20px 20px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.card{background:var(--card);border-radius:20px;margin:0 16px 12px;padding:18px}
.meta{font-size:12px;color:var(--sub);margin-bottom:12px;display:flex;justify-content:space-between}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tm{display:flex;align-items:center;gap:10px;font-weight:700;flex:1}.tm.r{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ob{background:var(--bg);border-radius:12px;padding:12px;font-weight:700;display:flex;justify-content:space-between;font-size:14px}.ob b{color:var(--pri)}
.ob.fav b{color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.x{float:right;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.pk{padding:16px;border-radius:16px;background:var(--bg);border:2px solid transparent;text-align:left;font-weight:700}.pk.on{border-color:var(--pri);background:var(--priBg)}
.pk small{display:block;color:var(--sub);font-weight:500;margin-bottom:4px}.pk span{font-size:22px;color:var(--pri)}
.sec{font-weight:800;margin:22px 0 8px;font-size:16px}
.form{display:flex;gap:4px}.f{width:22px;height:22px;border-radius:6px;font-size:11px;display:grid;place-items:center;color:#fff;font-weight:700}.W{background:var(--grn)}.L{background:var(--red)}
.chips{display:flex;gap:8px;margin:10px 0}.chips button{flex:1;padding:10px;border-radius:12px;background:var(--bg);font-weight:700;font-size:13px}
.est{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-top:10px}.est b{color:var(--tx)}
.post{background:var(--card);border-radius:18px;margin:0 16px 10px;padding:16px}.post .u{font-weight:700;font-size:14px}.post .u i{font-style:normal;color:var(--sub);font-weight:500;font-size:12px;margin-left:6px}.post p{margin:8px 0;font-size:15px;line-height:1.5}
.tag{display:inline-block;background:var(--priBg);color:var(--pri);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.lk{background:none;color:var(--sub);font-size:13px;padding:0}
.comp{display:flex;gap:8px;margin:0 16px 14px}.comp input{flex:1}.comp button{padding:0 18px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700}
.badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}.b-open{background:var(--priBg);color:var(--pri)}.b-win{background:#dcf5ea;color:var(--grn)}.b-lose{background:#fde4e6;color:var(--red)}
.demo{background:#fff4d6;color:#8a5a00;font-size:12px;border-radius:12px;padding:10px 12px;margin:14px 16px 0;line-height:1.5}
.ghost{width:calc(100% - 32px);margin:8px 16px;padding:14px;border-radius:14px;background:var(--card);font-weight:700;color:var(--pri)}
</style></head><body><div class="app" id="app"></div>
<script>
var T={G:["건국대","#1f8a4c"],H:["경희대","#c8102e"],K:["고려대","#8b0029"],D:["단국대","#0a5aa8"],O:["동국대","#c99700"],S:["상명대","#6a4bbd"],U:["성균관대","#0b6b3a"],Y:["연세대","#1d3f94"],M:["명지대","#2b7a9b"],C:["조선대","#7a1f6e"],J:["중앙대","#2d5bd0"],A:["한양대","#0a3a8a"]};
// KUSF U-리그 남자농구 정규리그 결과(과거 시즌 기록, 시간순). 형식: 팀코드+점수+팀코드+점수
var R="H71M73 J88S80 C62A82 K88D58 Y94G67 U73O76 S73M83 J76H68 U71Y78 O71G72 C47K112 A60D58 S66H59 M78J102 Y88O53 G84U87 D95C67 K93A52 S63J82 M84H81 O62U73 G48Y69 A83C59 D47K82 C64D83 A65K81 U86G73 O55Y80 J70M65 H82S63 Y84U65 G79O74 M81S76 H62J56 K94C43 D78A73 H43K63 D80M48 Y84A79 U62J65 G85C66 S59O66 U78C56 K91M51 Y72J57 H65D57 A79O71 G83S48 O52D70 J85G74 C58H96 K98U61 M83A88 C76M96 A48H60 O77J65 K62Y45 S46U67 D76G71 H59Y75 J96C58 G75M49 U55D66 S61A84 O56K96 Y74S50 J54K66 G79A49 U72H60 M70O80 Y86C58 D85S69 M65U75 A74J71 C78S101 D60Y50 O82H69 K91G64 A82U68 J83D67 H55G53 C73O87 M55Y78 S68K67".split(" ").map(function(s){var m=s.match(/(\D)(\d+)(\D)(\d+)/);return{a:m[1],as:+m[2],b:m[3],bs:+m[4]}});
var E={},HI={},REC={},LOG={};Object.keys(T).forEach(function(k){E[k]=1500;HI[k]=[1500];LOG[k]=[]});
R.forEach(function(g){var p=1/(1+Math.pow(10,(E[g.b]-E[g.a])/400)),w=g.as>g.bs?1:0;E[g.a]+=24*(w-p);E[g.b]-=24*(w-p);HI[g.a].push(E[g.a]);HI[g.b].push(E[g.b]);LOG[g.a].push({o:g.b,w:w,d:g.as-g.bs});LOG[g.b].push({o:g.a,w:1-w,d:g.bs-g.as})});
function prob(a,b){return 1/(1+Math.pow(10,(E[b]-E[a])/400))}
function odd(p){return Math.max(1.05,Math.round(94/p)/100)}
// 예시 일정(라운드로빈 생성) — 실제 KUSF 일정 연동 전 데모
var M=[],ks=Object.keys(T),arr=ks.slice(),day=new Date(2026,10,2),cnt=0,WK=["일","월","화","수","목","금","토"];
for(var r=0;r<3;r++){for(var i=0;i<6;i++){var h=arr[i],a=arr[11-i];if(r%2)var t=h,h=a,a=t;if(cnt&&cnt%2==0){day.setDate(day.getDate()+1);while(day.getDay()%6==0)day.setDate(day.getDate()+1)}
M.push({id:M.length,h:h,a:a,d:(day.getMonth()+1)+"월 "+day.getDate()+"일 ("+WK[day.getDay()]+")",t:"17:00"});cnt++}arr.splice(1,0,arr.pop())}
var S={v:"land",u:null,tab:"match",sel:null,side:null,stake:10,posts:[{u:"농구광",t:"K",m:0,x:"고려대 요즘 기록 보면 득실마진이 압도적이에요. 이번엔 안전하게 간다.",l:12},{u:"레이업",t:"Y",m:null,x:"연세대 vs 고려대 H2H 보면 접전이 많았음. 배당만 보고 판단하기엔 이르다고 봄.",l:7},{u:"뉴비",t:"D",m:2,x:"단국대 최근 5경기 폼 어때요? 차트 보는 법 알려주세요!",l:3}]};
try{var sv=JSON.parse(localStorage.getItem("cp1"));if(sv&&sv.u){S.u=sv.u;S.posts=sv.posts||S.posts;S.v="main"}}catch(e){}
function save(){try{localStorage.setItem("cp1",JSON.stringify({u:S.u,posts:S.posts}))}catch(e){}}
function dot(k,c){return '<div class="dot '+(c||"")+'" style="background:'+T[k][1]+'">'+T[k][0][0]+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var court='<svg viewBox="0 0 400 190"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient></defs><rect x="20" y="40" width="360" height="160" rx="14" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"><rect x="20" y="40" width="360" height="160" rx="14"/><line x1="200" y1="40" x2="200" y2="200"/><circle cx="200" cy="120" r="30"/><path d="M20 80h60v80H20M380 80h-60v80h60"/><path d="M80 90a30 30 0 010 60M320 90a30 30 0 000 60"/></g><circle cx="300" cy="46" r="24" fill="#ff7a1a"/><path d="M276 46h48M300 22v48M283 29c10 10 10 28 0 36M317 29c-10 10-10 28 0 36" stroke="#7a2e00" stroke-width="2" fill="none"/></svg>';
function land(){return '<div class="hero"><div class="logo">COURT PICK</div><h1>대학농구,<br>아는 만큼 맞힌다</h1><p>분석하고, 예측하고, 응원 학교의 이름을 올려보세요.</p>'+court+'</div><div class="panel"><label>이메일</label><input type="email" id="em" placeholder="name@email.com" autocomplete="email"><label>닉네임</label><input type="text" id="nk" maxlength="12" placeholder="2~12자"><button class="cta" id="go" data-a="start" disabled>시작하기</button><div class="note">학교 인증 없이 바로 참여할 수 있어요. 예측용 토큰은 웹 안에서만 쓰이는 가상 포인트이며 현금·상품으로 교환되지 않습니다.</div></div>'}
function pickTeam(){return '<div class="panel"><h2>응원하는 학교를<br>골라주세요</h2><p class="sub">선택하면 기본 토큰 100개를 드려요.</p><div class="grid">'+ks.map(function(k){return '<button class="tc'+(S.tmp==k?" on":"")+'" data-a="team" data-k="'+k+'">'+dot(k)+T[k][0]+'</button>'}).join("")+'</div><button class="cta" data-a="join"'+(S.tmp?"":" disabled")+'>토큰 100개 받고 시작</button></div>'}
function topbar(){return '<div class="top"><div class="row"><b style="font-size:18px">COURT PICK</b><div class="chip"><span class="coin"></span>'+S.u.tk.toLocaleString()+'</div></div><div class="tabs">'+[["match","경기"],["comm","커뮤니티"],["my","내 예측"]].map(function(t){return '<button class="tab'+(S.tab==t[0]?" on":"")+'" data-a="tab" data-k="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div></div>'}
function card(m){var p=prob(m.h,m.a),oh=odd(p),oa=odd(1-p),mine=m.h==S.u.team||m.a==S.u.team,done=S.u.bets.some(function(b){return b.m==m.id});
return '<div class="card" data-a="open" data-k="'+m.id+'"><div class="meta"><span>'+m.t+' · KUSF 남자 U-리그'+(mine?' · <span class="tag">내 응원팀</span>':'')+'</span><span>'+(done?"참여함":"")+'</span></div><div class="vs"><div class="tm">'+dot(m.h,"s")+T[m.h][0]+'</div><span style="color:var(--sub);font-size:12px">VS</span><div class="tm r">'+dot(m.a,"s")+T[m.a][0]+'</div></div><div class="odds"><div class="ob'+(oh<oa?" fav":"")+'">'+T[m.h][0]+' <b>'+oh.toFixed(2)+'</b></div><div class="ob'+(oa<oh?" fav":"")+'">'+T[m.a][0]+' <b>'+oa.toFixed(2)+'</b></div></div></div>'}
function matches(){var o='<div class="demo">예시 일정입니다. 팀·기록은 KUSF 남자 U-리그 실제 데이터(과거 시즌 결과)를 사용했고, 새 시즌 일정이 공개되면 교체됩니다.</div>',d="";M.forEach(function(m){if(m.d!=d){d=m.d;o+='<div class="date">'+d+'</div>'}o+=card(m)});return o}
function chart(a,b){var n=14,sa=HI[a].slice(-n),sb=HI[b].slice(-n),all=sa.concat(sb),mn=Math.min.apply(0,all)-10,mx=Math.max.apply(0,all)+10,W=320,H=110;
function pl(s,c){return '<polyline fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round" points="'+s.map(function(v,i){return (i*W/(n-1)).toFixed(1)+","+(H-(v-mn)/(mx-mn)*H).toFixed(1)}).join(" ")+'"/>'}
return '<svg viewBox="-4 -6 328 122" style="width:100%"><g stroke="var(--line)"><line x1="0" x2="'+W+'" y1="0" y2="0"/><line x1="0" x2="'+W+'" y1="55" y2="55"/><line x1="0" x2="'+W+'" y1="110" y2="110"/></g>'+pl(sa,T[a][1])+pl(sb,T[b][1])+'</svg>'}
function formRow(k){return '<div class="form">'+LOG[k].slice(-5).map(function(g){return '<div class="f '+(g.w?"W":"L")+'">'+(g.w?"승":"패")+'</div>'}).join("")+'</div>'}
function avg(k){var l=LOG[k].slice(-8),s=0;l.forEach(function(g){s+=g.d});return (s/l.length).toFixed(1)}
function sheet(){var m=M[S.sel],p=prob(m.h,m.a),od={h:odd(p),a:odd(1-p)},s=S.side,h2=R.filter(function(g){return(g.a==m.h&&g.b==m.a)||(g.a==m.a&&g.b==m.h)}).map(function(g){return (T[g.a][0].replace("대","")+" "+g.as+":"+g.bs+" "+T[g.b][0].replace("대",""))}),st=Math.min(S.stake,S.u.tk);
var rating=function(k){return Math.round(E[k])};
return '<div class="sheet" data-a="close"><div class="sh" data-a="stop"><button class="x" data-a="close">✕</button><div class="meta" style="margin:0">'+m.d+' '+m.t+'</div><h2>'+T[m.h][0]+' vs '+T[m.a][0]+'</h2><div class="pick">'+["h","a"].map(function(x){var k=m[x];return '<button class="pk'+(s==x?" on":"")+'" data-a="side" data-k="'+x+'"><small>'+T[k][0]+' 승</small><span>'+od[x].toFixed(2)+'</span></button>'}).join("")+'</div>'+
'<div class="chips">'+[10,25,50,100].map(function(v){return '<button data-a="stk" data-k="'+v+'">'+v+'</button>'}).join("")+'<button data-a="stk" data-k="'+S.u.tk+'">전액</button></div><input type="number" id="stk" min="1" value="'+st+'" placeholder="걸 토큰 수"><div class="est"><span>예상 획득</span><b>'+(s?Math.floor(st*od[s]):"-")+' 토큰</b></div><button class="cta" data-a="bet"'+(s&&st>=1&&st<=S.u.tk?"":" disabled")+'>예측하기</button>'+
'<div class="sec">레이팅 추이</div>'+chart(m.h,m.a)+'<div class="row" style="font-size:13px;font-weight:700"><span style="color:'+T[m.h][1]+'">● '+T[m.h][0]+' '+rating(m.h)+'</span><span style="color:'+T[m.a][1]+'">● '+T[m.a][0]+' '+rating(m.a)+'</span></div>'+
'<div class="sec">최근 5경기</div><div class="row" style="margin-bottom:8px"><b style="font-size:14px">'+T[m.h][0]+'</b>'+formRow(m.h)+'</div><div class="row"><b style="font-size:14px">'+T[m.a][0]+'</b>'+formRow(m.a)+'</div><div class="sec">최근 8경기 평균 득실마진</div><div class="row" style="font-size:15px"><span>'+T[m.h][0]+' <b>'+avg(m.h)+'</b></span><span>'+T[m.a][0]+' <b>'+avg(m.a)+'</b></span></div><div class="sec">맞대결 기록</div><div style="font-size:14px;color:var(--sub);line-height:1.7">'+(h2.join("<br>")||"기록 없음")+'</div><div class="note">배당은 팀 레이팅(승패 기반 Elo)으로 산출한 참고용 수치입니다. 토큰은 가상 포인트이며 현금·상품으로 교환되지 않아요.</div></div></div>'}
function comm(){return '<div style="height:14px"></div><div class="comp"><input type="text" id="px" maxlength="140" placeholder="경기 분석을 남겨보세요"><button data-a="post">등록</button></div>'+S.posts.map(function(p,i){return '<div class="post"><div class="u">'+esc(p.u)+'<i>'+T[p.t][0]+' 응원</i></div>'+(p.m!=null&&M[p.m]?'<span class="tag">'+T[M[p.m].h][0]+' vs '+T[M[p.m].a][0]+'</span>':"")+'<p>'+esc(p.x)+'</p><button class="lk" data-a="like" data-k="'+i+'">♥ '+p.l+'</button></div>'}).join("")}
function my(){var b=S.u.bets,o=b.filter(function(x){return x.s=="o"}).length,w=b.filter(function(x){return x.s=="w"}).length,l=b.filter(function(x){return x.s=="l"}).length;
return '<div class="card" style="margin-top:16px"><div class="row"><div><b style="font-size:18px">'+esc(S.u.nick)+'</b><div class="meta" style="margin:4px 0 0">'+T[S.u.team][0]+' 응원 · 적중 '+w+' / 종료 '+(w+l)+'</div></div>'+dot(S.u.team,"s")+'</div></div>'+(o?'<button class="ghost" data-a="sim">데모: 진행 중 예측 결과 확인</button>':"")+(b.length?b.slice().reverse().map(function(x){var m=M[x.m];return '<div class="card"><div class="meta"><span>'+m.d+'</span><span class="badge b-'+x.s+'">'+{o:"진행 중",w:"+"+x.win+" 토큰",l:"-"+x.stake+" 토큰"}[x.s]+'</span></div><b>'+T[x.side][0]+' 승 예측</b><div class="est"><span>'+x.stake+' 토큰 · 배당 '+x.odds.toFixed(2)+'</span></div></div>'}).join(""):'<div class="date">아직 예측 내역이 없어요</div>')}
function render(){var a=document.getElementById("app"),h="";
if(S.v=="land")h=land();else if(S.v=="team")h=pickTeam();else h=topbar()+(S.tab=="match"?matches():S.tab=="comm"?comm():my())+(S.sel!=null?sheet():"");
a.innerHTML=h;var em=document.getElementById("em");if(em){var f=function(){document.getElementById("go").disabled=!(/^\S+@\S+\.\S+$/.test(em.value)&&document.getElementById("nk").value.trim().length>=2)};em.oninput=f;document.getElementById("nk").oninput=f;if(S.em){em.value=S.em;document.getElementById("nk").value=S.nk;f()}}
var sk=document.getElementById("stk");if(sk)sk.oninput=function(){S.stake=Math.max(0,Math.floor(+sk.value||0));var b=document.querySelector("[data-a=bet]");b.disabled=!(S.side&&S.stake>=1&&S.stake<=S.u.tk);var e=document.querySelector(".est b");if(S.side){var m=M[S.sel],p=prob(m.h,m.a);e.textContent=Math.floor(S.stake*(S.side=="h"?odd(p):odd(1-p)))+" 토큰"}}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,k=t.dataset.k;
if(a=="stop"){return}
if(a=="start"){S.em=document.getElementById("em").value;S.nk=document.getElementById("nk").value.trim();S.v="team"}
else if(a=="team")S.tmp=k;
else if(a=="join"){S.u={email:S.em,nick:S.nk,team:S.tmp,tk:100,bets:[]};S.v="main";save()}
else if(a=="tab"){S.tab=k;S.sel=null}
else if(a=="open"){S.sel=+k;S.side=null;S.stake=10}
else if(a=="close"){if(e.target==t)S.sel=null}
else if(a=="side")S.side=k;
else if(a=="stk")S.stake=+k;
else if(a=="bet"){var m=M[S.sel],p=prob(m.h,m.a),od=S.side=="h"?odd(p):odd(1-p),st=Math.min(S.stake,S.u.tk);if(S.u.bets.some(function(b){return b.m==m.id})){alert("이미 참여한 경기예요.");return}
S.u.tk-=st;S.u.bets.push({m:m.id,side:m[S.side],odds:od,stake:st,s:"o",p:S.side=="h"?p:1-p});S.sel=null;S.tab="my";save()}
else if(a=="post"){var v=document.getElementById("px").value.trim();if(!v)return;S.posts.unshift({u:S.u.nick,t:S.u.team,m:null,x:v,l:0});save()}
else if(a=="like"){S.posts[+k].l++;save()}
else if(a=="sim"){S.u.bets.forEach(function(b){if(b.s=="o"){if(Math.random()<b.p){b.s="w";b.win=Math.floor(b.stake*b.odds);S.u.tk+=b.win}else b.s="l"}});save()}
render()});
render();
</script></body></html>
